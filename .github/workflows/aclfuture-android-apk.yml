name: ACLFUTURE Music 1.9 - Biblioteca com playlists e downloads
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-studio/**'
      - '.github/workflows/aclfuture-android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK Android
        working-directory: android-studio
        run: gradle --no-daemon :app:assembleDebug
      - name: Android Lint
        working-directory: android-studio
        run: gradle --no-daemon :app:lintDebug
      - name: Verificar assinatura e manifesto
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-studio/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-studio/app/build/outputs/apk/debug/app-debug.apk | head -23
      - name: Testar catálogo mundial com respostas reais
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          for artist in ['Engenheiros do Hawaii','Iron Maiden','Queen','Taylor Swift']:
              p=urllib.parse.urlencode(dict(term=artist,media='music',entity='song',attribute='artistTerm',country='BR',limit='100'))
              try:
                  with urllib.request.urlopen('https://itunes.apple.com/search?'+p,timeout=20) as r:
                      records=json.load(r)['results']
                  found=[x for x in records if x.get('artistName','').lower()==artist.lower()]
                  print('CATALOGO:',artist,'originais creditados:',len(found))
                  if not found: raise RuntimeError('Artista ausente no catalogo: '+artist)
              except Exception as e:
                  print('FALHA CATÁLOGO:',artist,str(e));raise
          PY
      - name: Testar sugestões de artistas com catálogo real
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          for term in ['engenheiro','Guns N Roses','Queen','Iron']:
              p=urllib.parse.urlencode(dict(term=term,media='music',entity='musicArtist',country='BR',limit='40'))
              with urllib.request.urlopen('https://itunes.apple.com/search?'+p,timeout=18) as r:
                  records=json.load(r).get('results',[])
              names=[x.get('artistName','') for x in records]
              print('SUGESTOES:',term,'quantidade:',len(names),'exemplos:',names[:7])
          PY
      - name: Testar busca por nome de musica e artista em catalogo real
        continue-on-error: true
        run: |
          python3 - <<'PYTEST'
          import json, urllib.request, urllib.parse, unicodedata
          tests=[('Infinita Highway','Engenheiros do Hawaii'),('November Rain',"Guns N' Roses"),('Bohemian Rhapsody','Queen')]
          def clean(x):
              return ''.join(c for c in unicodedata.normalize('NFD',x.casefold()) if not unicodedata.combining(c))
          for title,artist in tests:
              p=urllib.parse.urlencode(dict(term=title,media='music',entity='song',attribute='songTerm',country='BR',limit='100'))
              with urllib.request.urlopen('https://itunes.apple.com/search?'+p,timeout=20) as r:
                  songs=json.load(r).get('results',[])
              matching=[x for x in songs if clean(artist) in clean(x.get('artistName','')) and clean(title) in clean(x.get('trackName',''))]
              print('FAIXA:',title,'| ARTISTA:',artist,'| REGISTROS ENCONTRADOS:',len(matching))
              if not matching: raise RuntimeError('Nenhuma correspondencia encontrada para '+title+' - '+artist)
          PYTEST
      - name: Testar grafia aproximada no MusicBrainz (consulta real)
        continue-on-error: true
        run: |
          python3 - <<'PYMB'
          import json,urllib.parse,urllib.request
          tests=[('mylles ke','Myles Kennedy'),('engnheiros hawai','Engenheiros do Hawaii'),('sufjan stvens','Sufjan Stevens')]
          for typed,expected in tests:
              terms=[t for t in typed.split() if len(t)>=2]
              query=' AND '.join('artist:'+t+('*' if len(t)<=3 else '~1') for t in terms)
              url='https://musicbrainz.org/ws/2/artist/?'+urllib.parse.urlencode({'query':query,'fmt':'json','limit':30})
              request=urllib.request.Request(url,headers={'User-Agent':'ACLFUTURE-Music/1.8 (https://github.com/aclfilho39/sge-online)'})
              with urllib.request.urlopen(request,timeout=18) as response: names=[x['name'] for x in json.load(response).get('artists',[])]
              print('GRAFIA:',typed,'ESPERADO:',expected,'TOP:',names[:8])
              if expected.casefold() not in [x.casefold() for x in names]:raise RuntimeError('Sem candidato: '+expected)
              import time;time.sleep(1.2)
          PYMB
      - name: Testar JavaScript sem erro de sintaxe
        run: node --check android-studio/app/src/main/assets/www/app.js
      - name: Testar construtor de consultas aproximadas Java
        working-directory: android-studio
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.aclfuture.music.FuzzySearchQueryTest
      - name: Testar busca e extração de áudio real (não bloqueante)
        working-directory: android-studio
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.aclfuture.music.ExtractorLiveSmokeTest --info
      - name: Validar ponte nativa offline e identidade oficial
        run: |
          test -s android-studio/app/src/main/java/com/aclfuture/music/OfflineBridge.java
          test -s android-studio/app/src/main/assets/www/assets/by-tunico.png
          grep -q "ACLNativeOffline" android-studio/app/src/main/java/com/aclfuture/music/MainActivity.java
          grep -q "playOffline" android-studio/app/src/main/java/com/aclfuture/music/PlayerBridge.java
      - name: Publicar artefato APK
        uses: actions/upload-artifact@v4
        with:
          name: ACLFUTURE-Music-Android-1.9-APK
          path: android-studio/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK para download via navegador Android
        if: github.ref == 'refs/heads/aclfuture-music-android-1-9-biblioteca'
        run: |
          mkdir -p release
          cp android-studio/app/build/outputs/apk/debug/app-debug.apk release/ACLFUTURE_Music_1.9_BIBLIOTECA.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f release/ACLFUTURE_Music_1.9_BIBLIOTECA.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish ACLFUTURE Music 1.9 fuzzy search APK [skip ci]'
            git push origin HEAD:refs/heads/aclfuture-music-android-1-9-biblioteca
          fi
