name: ACLFUTURE Music - compilar e verificar APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-studio/**'
      - '.github/workflows/aclfuture-android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de teste
        working-directory: android-studio
        run: gradle --no-daemon :app:assembleDebug
      - name: Auditoria Android Lint
        working-directory: android-studio
        run: gradle --no-daemon :app:lintDebug
      - name: Verificar assinatura e manifesto do APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-studio/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-studio/app/build/outputs/apk/debug/app-debug.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: ACLFUTURE-Music-Android-APK
          path: android-studio/app/build/outputs/apk/debug/app-debug.apk
