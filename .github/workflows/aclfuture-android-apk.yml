name: ACLFUTURE Music - compilar e verificar APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-studio/**'
      - '.github/workflows/aclfuture-android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de teste
        working-directory: android-studio
        run: gradle --no-daemon :app:assembleDebug
      - name: Auditoria Android Lint
        working-directory: android-studio
        run: gradle --no-daemon :app:lintDebug
      - name: Verificar assinatura e manifesto do APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-studio/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-studio/app/build/outputs/apk/debug/app-debug.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: ACLFUTURE-Music-Android-APK
          path: android-studio/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK para download direto
        if: github.ref == 'refs/heads/aclfuture-music-android-1-2-apk'
        run: |
          mkdir -p release
          cp android-studio/app/build/outputs/apk/debug/app-debug.apk release/ACLFUTURE_Music_Android_1.2.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f release/ACLFUTURE_Music_Android_1.2.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish signed Android test APK [skip ci]'
            git push origin HEAD:refs/heads/aclfuture-music-android-1-2-apk
          fi
