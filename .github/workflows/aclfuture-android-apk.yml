name: ACLFUTURE Music - compilar APK de teste
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-studio/**'
      - '.github/workflows/aclfuture-android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirmar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de teste
        working-directory: android-studio
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ACLFUTURE-Music-Android-APK
          path: android-studio/app/build/outputs/apk/debug/app-debug.apk
