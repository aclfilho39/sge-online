plugins { id 'com.android.application' }
android {
    namespace 'com.aclfuture.music'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aclfuture.music.preview13'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '1.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
